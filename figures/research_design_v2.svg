<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1230" viewBox="0 0 1100 1230">
<rect width="1100" height="1230" fill="#f4f7f8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54767a"/></marker></defs>
<text x="550" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#193b43">POST-EXERCISE IMMUNE MONITORING</text>
<text x="550" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#193b43">Planned research design | Protocol v2.0 | 2 October 2026</text>
<rect x="180" y="112" width="740" height="100" rx="12" fill="#ffffff" stroke="#bfd0d3"/>
<text x="550.0" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#193b43">Define candidate monitoring use</text>
<text x="550.0" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Seven separate precision domains; no composite score</text>
<text x="550.0" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">response, function, association and prediction remain distinct</text>
<path d="M550 212 L550 245" stroke="#54767a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="180" y="245" width="740" height="100" rx="12" fill="#ffffff" stroke="#bfd0d3"/>
<text x="550.0" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#193b43">Verify strategy, calibrate humans and register</text>
<text x="550.0" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Five databases: exercise AND immunity / exercise AND omics</text>
<text x="550.0" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">PRESS + 50-record screening pilot + 10-report charting pilot</text>
<path d="M550 345 L550 378" stroke="#54767a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="180" y="378" width="740" height="100" rx="12" fill="#ffffff" stroke="#bfd0d3"/>
<text x="550.0" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#193b43">Execute searches and independent dual screening</text>
<text x="550.0" y="439" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Preserve raw exports, source decisions and report / cohort links</text>
<text x="550.0" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Formal searches and flow counts: NOT YET AVAILABLE</text>
<path d="M410 478 L275 520" stroke="#54767a" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M690 478 L825 520" stroke="#54767a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="50" y="520" width="450" height="122" rx="12" fill="#e4f0ef" stroke="#bfd0d3"/>
<text x="275.0" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#193b43">CORE A: acute challenge</text>
<text x="275.0" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Identifiable bout + post-cessation sample</text>
<text x="275.0" y="606" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Pre-bout baseline or suitable comparator</text>
<text x="275.0" y="631" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Immediate sampling eligible; no 72-hour cap</text>
<rect x="600" y="520" width="450" height="122" rx="12" fill="#e4f0ef" stroke="#bfd0d3"/>
<text x="825.0" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#193b43">SUPPORT B: repeated bouts</text>
<text x="825.0" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Same marker / person after at least two bouts</text>
<text x="825.0" y="606" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Known exercise-to-sample timing</text>
<text x="825.0" y="631" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Baseline or comparator; chart separately</text>
<path d="M275 642 L410 686" stroke="#54767a" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M825 642 L690 686" stroke="#54767a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="180" y="686" width="740" height="125" rx="12" fill="#ffffff" stroke="#bfd0d3"/>
<text x="550.0" y="716" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#193b43">Chart and appraise with two humans</text>
<text x="550.0" y="747" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Timing, assay quality, participant n, effects and uncertainty</text>
<text x="550.0" y="772" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Individualization, measured function, clinical links and validation</text>
<text x="550.0" y="797" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Design-specific appraisal; original-source locations</text>
<path d="M550 811 L550 845" stroke="#54767a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="100" y="845" width="900" height="110" rx="12" fill="#d9ebe9" stroke="#bfd0d3"/>
<text x="550.0" y="875" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#193b43">THREE EVIDENCE MAPS</text>
<text x="550.0" y="906" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Time x immune compartment | Intended use x precision domains</text>
<text x="550.0" y="931" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Cohort-level validation links and remaining requirements</text>
<path d="M550 955 L550 989" stroke="#54767a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="180" y="989" width="740" height="100" rx="12" fill="#ffffff" stroke="#bfd0d3"/>
<text x="550.0" y="1019" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#193b43">Update search and prepare Frontiers submission</text>
<text x="550.0" y="1050" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">PRISMA-ScR / PRISMA-S + transparent data and limitations</text>
<text x="550.0" y="1075" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Scoping methodology; no meta-analysis or clinical ranking</text>
<text x="550" y="1132" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Independent cohorts are the main density unit; A/B overlap is deduplicated.</text>
<text x="550" y="1163" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#193b43">Public preprints: separate frontier register and denominators.</text>
<text x="550" y="1194" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#526c75">This figure describes the plan. It contains no completed-review results.</text>
</svg>
